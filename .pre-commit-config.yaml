# The single lint/format gate. Run it locally with
#   uv run pre-commit run --all-files
# or install it as a git hook with `uv run pre-commit install`. CI runs the
# same command (.github/workflows/pre-commit.yml).
#
# Each hook's version is pinned by `rev`; pre-commit itself is pinned in
# uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # static_fail/*.fail.txt are compiler-output snapshots; leave them as
      # the rebase target writes them. In a .patch, a blank context line is a
      # single space, which this hook would strip.
      - id: trailing-whitespace
        exclude: \.(fail\.txt|patch)$
      - id: end-of-file-fixer
        exclude: \.fail\.txt$
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        # The mirror also formats JSON, Java, ... by default; this repo only
        # formats C and C++, as the old clang-format action did.
        types_or: [c, c++]

  # Generated values the tests rely on (#94 T2): each generator recomputes
  # them and fails if the committed copy differs. Their dependencies are uv's
  # scripts group.
  - repo: local
    hooks:
      - id: black-scholes-reference
        name: Black-Scholes reference values
        entry: uv run --group scripts tools/black_scholes_sympy_value_check.py --check
        language: system
        files: ^(tools/black_scholes_sympy_value_check\.py|tests/fixtures/mc_sim/black_scholes_reference\.hpp)$
        pass_filenames: false
      - id: erfc-chebyshev
        name: cx_erfc.hpp Chebyshev table
        entry: uv run --group scripts tools/gen_erfc_chebyshev.py --check
        language: system
        files: ^(tools/gen_erfc_chebyshev\.py|include/cx_std/cx_erfc\.hpp)$
        pass_filenames: false
