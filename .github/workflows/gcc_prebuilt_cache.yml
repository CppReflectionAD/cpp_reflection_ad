# actions/cache variant — see gcc_prebuilt.yml for the GHCR/oras variant.
name: Test GCC (Prebuilt Cache)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "gcc-mirror"
      - ".github/workflows/toolchain-cache-gcc.yml"
  workflow_run:
    workflows: [ "Build GCC Toolchain (Cache)" ]
    types: [ completed ]
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute cache key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          GCC_MIRROR_SHA="$(git rev-parse HEAD:gcc-mirror)"
          BUILD_INPUT_HASH="$(sha256sum .github/workflows/toolchain-cache-gcc.yml | sha256sum | cut -d' ' -f1)"
          CACHE_KEY="gcc-${{ runner.os }}-${{ runner.arch }}-${GCC_MIRROR_SHA:0:12}-${BUILD_INPUT_HASH:0:12}"
          echo "cache_key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore gcc toolchain from cache
        id: cache
        uses: actions/cache@v6
        with:
          path: /opt/toolchain-gcc
          key: ${{ steps.key.outputs.cache_key }}

      - name: Fail fast on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "GCC toolchain not in cache: ${{ steps.key.outputs.cache_key }}"
          echo "Run workflow 'Build Toolchains (Cache)' first to populate the cache."
          exit 1

      - name: Configure CMake (gcc cached)
        run: |
          cmake -S . -B build/cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=/opt/toolchain-gcc/bin/g++

      - name: Build tests (gcc cached)
        run: cmake --build build/cmake --parallel

      - name: Test AD with CTest
        run: ctest --test-dir build/cmake --output-on-failure
