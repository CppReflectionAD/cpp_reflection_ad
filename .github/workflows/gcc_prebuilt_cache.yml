# Tests against the GCC toolchain cached by toolchain-cache-gcc.yml.
# The toolchain job restores the cache, or builds it on a miss, before tests run.
name: Test GCC (Prebuilt Cache)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  # Nightly on main, off the hour to avoid GitHub's peak queueing. Restoring
  # the toolchain resets the cache's 7-day eviction clock, or rebuilds it if
  # it was evicted, and the run catches drift that no PR triggers.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# A new push to a PR cancels that PR's previous run. Runs on main are never
# cancelled, so a toolchain build there always finishes and saves its cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  toolchain:
    uses: ./.github/workflows/toolchain-cache-gcc.yml

  test:
    name: test (${{ matrix.build_type }})
    needs: toolchain
    # Pinned to match toolchain-cache-gcc.yml, which builds the toolchain
    # restored here; the cache key doesn't record the image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo, Debug]
    env:
      BUILD_TYPE: ${{ matrix.build_type }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore gcc toolchain from cache
        uses: actions/cache/restore@v6
        with:
          path: /opt/toolchain-gcc
          key: ${{ needs.toolchain.outputs.cache_key }}
          fail-on-cache-miss: true

      # The CMakePresets.json preset for this build type (gcc-release, ...),
      # with the compiler swapped for the cached one.
      - name: Configure CMake
        run: |
          echo "PRESET=gcc-${BUILD_TYPE,,}" >> "$GITHUB_ENV"
          cmake --preset "gcc-${BUILD_TYPE,,}" \
            -DCMAKE_CXX_COMPILER=/opt/toolchain-gcc/bin/g++

      - name: Build tests
        run: cmake --build --preset "$PRESET"

      - name: Test AD with CTest
        run: ctest --preset "$PRESET"

  # ASan and UBSan (#94 T1), through the gcc-sanitize preset. It isn't in
  # the summary job's needs, so it isn't a required check yet; #94 C8 makes it
  # one once it has proved stable.
  sanitize:
    name: sanitize (ASan+UBSan)
    needs: toolchain
    # Pinned to match toolchain-cache-gcc.yml, like the test legs.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore gcc toolchain from cache
        uses: actions/cache/restore@v6
        with:
          path: /opt/toolchain-gcc
          key: ${{ needs.toolchain.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Configure CMake
        run: |
          cmake --preset gcc-sanitize \
            -DCMAKE_CXX_COMPILER=/opt/toolchain-gcc/bin/g++

      - name: Build tests
        run: cmake --build --preset gcc-sanitize

      - name: Test AD with CTest
        run: ctest --preset gcc-sanitize

  # A Release build with -march=x86-64-v3 (#94 C9), through the
  # gcc-x86-64-v3 preset. It turns on FMA, which arm64 always has and plain
  # x86-64 lacks, so FMA contraction bugs like #95's show here too. Like
  # sanitize, it isn't in the summary job's needs yet.
  x86-64-v3:
    name: test (Release, x86-64-v3)
    needs: toolchain
    # Pinned to match toolchain-cache-gcc.yml, like the test legs.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Otherwise a runner without AVX2 or FMA fails every test with SIGILL.
      - name: Check that the runner supports x86-64-v3
        run: |
          /lib64/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v3 (supported' || {
            echo "::error::This runner's CPU doesn't support x86-64-v3."
            exit 1
          }

      - name: Restore gcc toolchain from cache
        uses: actions/cache/restore@v6
        with:
          path: /opt/toolchain-gcc
          key: ${{ needs.toolchain.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Configure CMake
        run: |
          cmake --preset gcc-x86-64-v3 \
            -DCMAKE_CXX_COMPILER=/opt/toolchain-gcc/bin/g++

      - name: Build tests
        run: cmake --build --preset gcc-x86-64-v3

      - name: Test AD with CTest
        run: ctest --preset gcc-x86-64-v3

  # The one check for the ruleset to require (#94 C4), so it names this
  # workflow's result rather than each matrix leg. always() makes it report
  # even when the toolchain fails and the legs are skipped, or the run is
  # cancelled: a skipped required check would count as passing.
  summary:
    name: GCC tests
    needs: [toolchain, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "toolchain and test legs: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
