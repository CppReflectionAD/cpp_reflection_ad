# Tests against the GCC toolchain cached by toolchain-cache-gcc.yml.
# The toolchain job restores the cache, or builds it on a miss, before tests run.
name: Test GCC (Prebuilt Cache)

on:
  push:
    branches: ["main"]
  pull_request:
  # The merge queue waits for the required `GCC tests` on each queued change.
  merge_group:
  workflow_dispatch:
  # Nightly on main, off the hour to avoid GitHub's peak queueing. Restoring
  # the toolchain resets the cache's 7-day eviction clock, or rebuilds it if
  # it was evicted, and the run catches drift that no PR triggers.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# A new push to a PR cancels that PR's previous run. Runs on main are never
# cancelled, so a toolchain build there always finishes and saves its cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  toolchain:
    uses: ./.github/workflows/toolchain-cache-gcc.yml

  # Release, RelWithDebInfo and Debug, so they match `--build-type all`, and
  # ASan and UBSan (#94 T1) through the gcc-sanitize preset. All are in
  # the summary job's needs, so they're required (#94 C8).
  test:
    name: Linux x86-64
    needs: toolchain
    uses: ./.github/workflows/toolchain-test.yml
    with:
      compiler: gcc
      cache_key: ${{ needs.toolchain.outputs.cache_key }}
      runner: ${{ needs.toolchain.outputs.runner }}

  # A Release build with -march=x86-64-v3 (#94 C9), through the
  # gcc-x86-64-v3 preset. It turns on FMA, which arm64 always has and plain
  # x86-64 lacks, so FMA contraction bugs like #95's show here too. It
  # isn't in the summary job's needs yet.
  x86-64-v3:
    name: Linux x86-64-v3
    needs: toolchain
    uses: ./.github/workflows/toolchain-test.yml
    with:
      compiler: gcc
      cache_key: ${{ needs.toolchain.outputs.cache_key }}
      runner: ${{ needs.toolchain.outputs.runner }}
      presets: '["x86-64-v3"]'

  # The toolchain and test legs again on macOS arm64 (#94 C9), with GCC built
  # from gcc-darwin-reflect. The sanitize leg runs the tests under GCC's own
  # libasan and libubsan on macos-15. These jobs aren't in the summary job's
  # needs yet. GCC is built only on a cache miss: when the pin, the runner's
  # SDK or linker, the build script or the recipe changes, or the cache was
  # evicted after 7 days unused.
  toolchain-macos:
    uses: ./.github/workflows/toolchain-cache-gcc.yml
    with:
      runner: macos-15

  test-macos:
    name: macOS arm64
    needs: toolchain-macos
    uses: ./.github/workflows/toolchain-test.yml
    with:
      compiler: gcc
      cache_key: ${{ needs.toolchain-macos.outputs.cache_key }}
      runner: ${{ needs.toolchain-macos.outputs.runner }}
      macos_sdk: ${{ needs.toolchain-macos.outputs.macos_sdk }}

  # The toolchain and test legs again on Linux arm64 (#94 C9), on GitHub's
  # hosted ubuntu-24.04-arm runners, with the same recipe as x86-64. arm64
  # always has FMA, so FMA contraction bugs like #95's show here, as on the
  # group's Macs. runner.arch is in the cache key, so this leg has its own
  # toolchain. These jobs aren't in the summary job's needs yet.
  toolchain-arm64:
    uses: ./.github/workflows/toolchain-cache-gcc.yml
    with:
      runner: ubuntu-24.04-arm

  test-arm64:
    name: Linux arm64
    needs: toolchain-arm64
    uses: ./.github/workflows/toolchain-test.yml
    with:
      compiler: gcc
      cache_key: ${{ needs.toolchain-arm64.outputs.cache_key }}
      runner: ${{ needs.toolchain-arm64.outputs.runner }}

  # Each toolchain as a release asset for `run_tests.py --fetch-compilers`
  # (#165): packed and checked until its pin and recipe are published, and
  # published from main. Not in the summary's needs, so it never holds up the
  # required check, and skipped in the merge queue, which can't publish.
  # Publishing needs contents: write, which only the publish job inside gets.
  archive:
    needs: toolchain
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/toolchain-archive.yml
    permissions:
      contents: write
    with:
      compiler: gcc
      cache_key: ${{ needs.toolchain.outputs.cache_key }}
      runner: ${{ needs.toolchain.outputs.runner }}

  archive-macos:
    needs: toolchain-macos
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/toolchain-archive.yml
    permissions:
      contents: write
    with:
      compiler: gcc
      cache_key: ${{ needs.toolchain-macos.outputs.cache_key }}
      runner: ${{ needs.toolchain-macos.outputs.runner }}
      macos_sdk: ${{ needs.toolchain-macos.outputs.macos_sdk }}

  archive-arm64:
    needs: toolchain-arm64
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/toolchain-archive.yml
    permissions:
      contents: write
    with:
      compiler: gcc
      cache_key: ${{ needs.toolchain-arm64.outputs.cache_key }}
      runner: ${{ needs.toolchain-arm64.outputs.runner }}

  # The one check for the ruleset to require (#94 C4), so it names this
  # workflow's result rather than each matrix leg. always() makes it report
  # even when the toolchain fails and the legs are skipped, or the run is
  # cancelled: a skipped required check would count as passing.
  summary:
    name: GCC tests
    needs: [toolchain, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check that every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "toolchain and Linux x86-64 test legs: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
