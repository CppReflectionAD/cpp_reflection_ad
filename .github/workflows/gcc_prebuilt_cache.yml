# Tests against the GCC toolchain cached by toolchain-cache-gcc.yml.
# The toolchain job restores the cache, or builds it on a miss, before tests run.
name: Test GCC (Prebuilt Cache)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's previous run. Runs on main are never
# cancelled, so a toolchain build there always finishes and saves its cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  toolchain:
    uses: ./.github/workflows/toolchain-cache-gcc.yml

  test:
    name: test (${{ matrix.build_type }})
    needs: toolchain
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo, Debug]
    env:
      BUILD_DIR: build/cmake-${{ matrix.build_type }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Restore gcc toolchain from cache
        uses: actions/cache/restore@v6
        with:
          path: /opt/toolchain-gcc
          key: ${{ needs.toolchain.outputs.cache_key }}
          fail-on-cache-miss: true

      - name: Configure CMake
        run: |
          GCC_LIBSTDCPP_DIR="$(dirname "$(/opt/toolchain-gcc/bin/g++ -print-file-name=libstdc++.so.6)")"
          GCC_LIBGCC_DIR="$(dirname "$(/opt/toolchain-gcc/bin/g++ -print-file-name=libgcc_s.so.1)")"
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=/opt/toolchain-gcc/bin/g++ \
            "-DCMAKE_BUILD_RPATH=${GCC_LIBSTDCPP_DIR};${GCC_LIBGCC_DIR}"

      - name: Build tests
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Test AD with CTest
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure
