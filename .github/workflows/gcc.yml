name: Test GCC

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Use 'true' for top-level submodules or 'recursive' for nested submodules
          submodules: true 

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev texinfo zlib1g-dev dejagnu python3

      - name: Test Exit 0
        run: |
          ls -al nonexistent
          exit 0

      - name: Build GCC
        run: |
          python3 run_tests.py --compiler gcc --build-compilers
          exit 0

      - name: Test AD
        run: |
          python3 run_tests.py --compiler gcc --tests 'ad_scalar_demo.cpp' --run-executables

      - name: Test Reflection
        run: |
          cd build/gcc-mirror/gcc/
          make check-g++ RUNTESTFLAGS="dg.exp=reflect/*.C"