name: Test GCC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Use 'true' for top-level submodules or 'recursive' for nested submodules
          submodules: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libgmp-dev libmpfr-dev libmpc-dev texinfo zlib1g-dev dejagnu python3

      - name: Build GCC
        continue-on-error: true
        run: |
          python3 run_tests.py --compiler gcc --build-compilers

      - name: Test AD
        run: |
          python3 run_tests.py --compiler gcc --run-executables
