# Restores the GCC toolchain from cache, building it on a miss.
# Called by gcc_prebuilt_cache.yml so tests wait for the toolchain.
# The cache key is the submodule commit plus a hash of the build script, so
# edits to this file don't invalidate the cache.
name: Build GCC Toolchain (Cache)

on:
  workflow_call:
    outputs:
      cache_key:
        description: Cache key holding /opt/toolchain-gcc
        value: ${{ jobs.gcc.outputs.cache_key }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcc:
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.key.outputs.cache_key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init gcc-mirror submodule only
        run: |
          git submodule sync -- gcc-mirror
          git submodule update --init --depth 1 gcc-mirror

      - name: Compute cache key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          GCC_MIRROR_SHA="$(git rev-parse HEAD:gcc-mirror)"
          BUILD_INPUT_HASH="$(sha256sum .github/scripts/build-gcc-toolchain.sh | cut -d' ' -f1)"
          CACHE_KEY="gcc-${{ runner.os }}-${{ runner.arch }}-${GCC_MIRROR_SHA:0:12}-${BUILD_INPUT_HASH:0:12}"
          echo "cache_key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore gcc toolchain from cache
        id: cache
        uses: actions/cache@v6
        with:
          path: /opt/toolchain-gcc
          key: ${{ steps.key.outputs.cache_key }}

      - name: Build and install GCC into clean prefix
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/build-gcc-toolchain.sh gcc-mirror /opt/toolchain-gcc

      - name: Verify cached prefix
        run: |
          ls -lh /opt/toolchain-gcc/bin/
          /opt/toolchain-gcc/bin/g++ --version
