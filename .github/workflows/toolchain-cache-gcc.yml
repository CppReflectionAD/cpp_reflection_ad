# Makes sure the GCC toolchain is in the cache, building it on a miss.
# Called by gcc_prebuilt_cache.yml so tests wait for the toolchain.
# On a hit this job only looks the key up; the test jobs restore the prefix.
# The cache key is the submodule commit plus a hash of the build script, so
# edits to this file don't invalidate the cache. The build itself is in
# .github/scripts/build-gcc-toolchain.sh.
name: Build GCC Toolchain (Cache)

on:
  workflow_call:
    outputs:
      cache_key:
        description: Cache key holding /opt/toolchain-gcc
        value: ${{ jobs.gcc.outputs.cache_key }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcc:
    # Pinned to match the test jobs in gcc_prebuilt_cache.yml: the cache key
    # doesn't record the image, so both sides must run on the same one.
    runs-on: ubuntu-24.04
    outputs:
      cache_key: ${{ steps.key.outputs.cache_key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the submodule commit from the superproject's tree, so the
      # submodule doesn't need to be cloned on a hit.
      - name: Compute cache key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          GCC_MIRROR_SHA="$(git rev-parse HEAD:gcc-mirror)"
          BUILD_INPUT_HASH="$(sha256sum .github/scripts/build-gcc-toolchain.sh | cut -d' ' -f1)"
          CACHE_KEY="gcc-${{ runner.os }}-${{ runner.arch }}-${GCC_MIRROR_SHA:0:12}-${BUILD_INPUT_HASH:0:12}"
          echo "cache_key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Check cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: /opt/toolchain-gcc
          key: ${{ steps.key.outputs.cache_key }}
          lookup-only: true

      - name: Init gcc-mirror submodule only
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git submodule sync -- gcc-mirror
          git submodule update --init --depth 1 gcc-mirror

      - name: Build and install GCC into clean prefix
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/build-gcc-toolchain.sh gcc-mirror /opt/toolchain-gcc

      - name: Verify built prefix
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ls -lh /opt/toolchain-gcc/bin/
          /opt/toolchain-gcc/bin/g++ --version

      - name: Save gcc toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /opt/toolchain-gcc
          key: ${{ steps.key.outputs.cache_key }}

      # actions/cache/save only warns when a save fails. Without this check the
      # job would stay green and every test job would then miss the cache.
      - name: Confirm the toolchain was saved
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: /opt/toolchain-gcc
          key: ${{ steps.key.outputs.cache_key }}
          lookup-only: true
          fail-on-cache-miss: true
