# Restores the clang toolchain from cache, building it on a miss.
# Called by clang_prebuilt_cache.yml so tests wait for the toolchain.
# The cache key is the submodule commit plus a hash of the build script, so
# edits to this file don't invalidate the cache.
name: Build Clang Toolchain (Cache)

on:
  workflow_call:
    outputs:
      cache_key:
        description: Cache key holding /opt/toolchain-clang
        value: ${{ jobs.clang.outputs.cache_key }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang:
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.key.outputs.cache_key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init clang-p2996 submodule only
        run: |
          git submodule sync -- clang-p2996
          git submodule update --init --depth 1 clang-p2996

      - name: Compute cache key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          CLANG_SHA="$(git rev-parse HEAD:clang-p2996)"
          BUILD_INPUT_HASH="$(sha256sum .github/scripts/build-clang-toolchain.sh | cut -d' ' -f1)"
          CACHE_KEY="clang-${{ runner.os }}-${{ runner.arch }}-${CLANG_SHA:0:12}-${BUILD_INPUT_HASH:0:12}"
          echo "cache_key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore clang toolchain from cache
        id: cache
        uses: actions/cache@v6
        with:
          path: /opt/toolchain-clang
          key: ${{ steps.key.outputs.cache_key }}

      - name: Build and install clang into clean prefix
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/build-clang-toolchain.sh clang-p2996 /opt/toolchain-clang

      - name: Verify cached prefix
        run: |
          set -euo pipefail
          ls -lh /opt/toolchain-clang/bin/
          ls -lh /opt/toolchain-clang/lib/libc++* 2>/dev/null || true

          ls -lh /opt/toolchain-clang/lib/clang/*/include/stddef.h
          /opt/toolchain-clang/bin/clang++ --version
