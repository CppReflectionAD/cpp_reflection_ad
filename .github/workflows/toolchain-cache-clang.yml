name: Build Clang Toolchain (Cache)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "clang-p2996"
      - ".github/workflows/toolchain-cache-clang.yml"

permissions:
  contents: read

jobs:
  clang:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init clang-p2996 submodule only
        run: |
          git submodule sync -- clang-p2996
          git submodule update --init --depth 1 clang-p2996

      - name: Compute cache key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          CLANG_SHA="$(git rev-parse HEAD:clang-p2996)"
          BUILD_INPUT_HASH="$(sha256sum .github/workflows/toolchain-cache-clang.yml | sha256sum | cut -d' ' -f1)"
          CACHE_KEY="clang-${{ runner.os }}-${{ runner.arch }}-${CLANG_SHA:0:12}-${BUILD_INPUT_HASH:0:12}"
          echo "cache_key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore clang toolchain from cache
        id: cache
        uses: actions/cache@v6
        with:
          path: /opt/toolchain-clang
          key: ${{ steps.key.outputs.cache_key }}

      - name: Install clang build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang lld \
            python3 zlib1g-dev git

      - name: Build clang (Release)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd clang-p2996

          cmake -G Ninja -S llvm -B build-llvm \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="$(python3 -c "import platform; print('X86' if 'x86' in platform.machine() else 'AArch64')")" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_PARALLEL_LINK_JOBS=1
          ninja -C build-llvm -j$(nproc) clang

      - name: Build libc++ runtimes (Release)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd clang-p2996

          cmake -G Ninja -S runtimes -B build-runtimes \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind" \
            -DCMAKE_C_COMPILER="$(pwd)/build-llvm/bin/clang" \
            -DCMAKE_CXX_COMPILER="$(pwd)/build-llvm/bin/clang++" \
            -DLLVM_BINARY_DIR="$(pwd)/build-llvm" \
            -DLLVM_CONFIG_PATH="$(pwd)/build-llvm/bin/llvm-config" \
            -DCMAKE_INSTALL_PREFIX="$(pwd)/build-runtimes/install"
          ninja -C build-runtimes -j$(nproc) cxx cxxabi install

      - name: Debug runtimes output
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Contents of build-runtimes/install:"
          find clang-p2996/build-runtimes/install -maxdepth 3 -type d | sort || true
          echo ""
          echo "Looking for libc++ libraries:"
          find clang-p2996/build-runtimes/install -type f \( -name 'libc++*.so*' -o -name 'libc++*.a' \) 2>/dev/null || echo "None found"
          echo ""
          echo "Looking for libc++abi libraries:"
          find clang-p2996/build-runtimes/install -type f \( -name 'libc++abi*.so*' -o -name 'libc++abi*.a' \) 2>/dev/null || echo "None found"

      - name: Inspect runtimes structure
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "=== Full directory tree ==="
          find clang-p2996/build-runtimes/install -type d | head -50
          echo ""
          echo "=== All .so and .a files ==="
          find clang-p2996/build-runtimes/install -type f \( -name "*.so*" -o -name "*.a" \) | sort
          echo ""
          echo "=== Disk usage ==="
          du -sh clang-p2996/build-runtimes/install/*/

      - name: Install into clean prefix
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX=/opt/toolchain-clang
          sudo mkdir -p "$PREFIX"

          sudo mkdir -p "$PREFIX/bin"
          for bin in clang-p2996/build-llvm/bin/clang \
                     clang-p2996/build-llvm/bin/clang++ \
                     clang-p2996/build-llvm/bin/llvm-config; do
            [ -f "$bin" ] && sudo cp -L "$bin" "$PREFIX/bin/"
          done

          sudo mkdir -p "$PREFIX/include"
          sudo cp -r clang-p2996/build-llvm/include/c++ "$PREFIX/include/"

          sudo mkdir -p "$PREFIX/lib"
          # Copy installed runtimes from CMAKE_INSTALL_PREFIX.
          if [ -d clang-p2996/build-runtimes/install/lib ]; then
            sudo cp -a clang-p2996/build-runtimes/install/lib/. "$PREFIX/lib/"
          fi

          # Keep the LLVM lib directory snapshot as a fallback for transitive deps.
          if [ -d clang-p2996/build-llvm/lib ]; then
            sudo cp -a clang-p2996/build-llvm/lib/. "$PREFIX/lib/"
          fi

          # Runtime libs may live under different subdirs depending on target/config.
          mapfile -t RUNTIME_LIBS < <(find "$PREFIX/lib" \( -type f -o -type l \) \
            \( -name 'libc++*.so*' -o -name 'libc++*.a' -o -name 'libc++abi*.so*' -o -name 'libc++abi*.a' -o -name 'libunwind*.so*' -o -name 'libunwind*.a' \) 2>/dev/null || true)

          if [ "${#RUNTIME_LIBS[@]}" -eq 0 ]; then
            echo "ERROR: No libc++ runtime artifacts found!"
            echo "Expected to find libc++/libc++abi/libunwind under $PREFIX/lib"
            echo "Contents of $PREFIX/lib:"
            find "$PREFIX/lib" -maxdepth 2 -type f | sort || true
            exit 1
          else
            echo "Found ${#RUNTIME_LIBS[@]} runtime library candidates"
          fi

          # Ensure unversioned linker names exist (e.g. -lc++ -> libc++.so).
          for lib in libc++ libc++abi libunwind; do
            if [ ! -e "$PREFIX/lib/${lib}.so" ]; then
              candidate="$(ls -1 "$PREFIX/lib/${lib}.so."* 2>/dev/null | head -n 1 || true)"
              if [ -n "$candidate" ]; then
                sudo ln -sf "$(basename "$candidate")" "$PREFIX/lib/${lib}.so"
              fi
            fi
          done

          # Clang builtin headers (e.g. stddef.h) live under lib/clang/*/include.
          # Without this, libc++'s include_next <stddef.h> can fail.
          sudo cp -r clang-p2996/build-llvm/lib/clang "$PREFIX/lib/"

          sudo cp clang-p2996/libcxx/include/meta "$PREFIX/include/c++/v1/meta"

          echo "Installed size: $(du -sh $PREFIX | cut -f1)"

      - name: Verify cached prefix
        run: |
          set -euo pipefail
          ls -lh /opt/toolchain-clang/bin/
          ls -lh /opt/toolchain-clang/lib/libc++* 2>/dev/null || true

          mapfile -t libcxx_candidates < <(find /opt/toolchain-clang/lib \( -type f -o -type l \) \
            \( -name 'libc++.so*' -o -name 'libc++.a' \))

          if [ "${#libcxx_candidates[@]}" -eq 0 ]; then
            echo "ERROR: Missing libc++ runtime under /opt/toolchain-clang/lib"
            echo "Current /opt/toolchain-clang/lib contents:"
            find /opt/toolchain-clang/lib -maxdepth 3 -mindepth 1 -type f | sort || true
            exit 1
          fi

          if [ ! -e /opt/toolchain-clang/lib/libc++.so ] && [ ! -e /opt/toolchain-clang/lib/libc++.a ]; then
            preferred=""
            for c in "${libcxx_candidates[@]}"; do
              case "$c" in
                *.so|*.so.*)
                  preferred="$c"
                  break
                  ;;
              esac
            done
            if [ -z "$preferred" ]; then
              preferred="${libcxx_candidates[0]}"
            fi
            if [ "$(dirname "$preferred")" != "/opt/toolchain-clang/lib" ]; then
              sudo ln -sf "$preferred" /opt/toolchain-clang/lib/"$(basename "$preferred")"
            fi
            if [[ "$preferred" == *.so || "$preferred" == *.so.* ]]; then
              sudo ln -sf "$(basename "$preferred")" /opt/toolchain-clang/lib/libc++.so
            else
              sudo ln -sf "$(basename "$preferred")" /opt/toolchain-clang/lib/libc++.a
            fi
          fi

          ls -lh /opt/toolchain-clang/lib/clang/*/include/stddef.h
          /opt/toolchain-clang/bin/clang++ --version
