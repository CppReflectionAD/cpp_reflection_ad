# The lint/format gate: the same hooks as `uv run pre-commit run --all-files`,
# plus a check that uv.lock matches pyproject.toml.
name: pre-commit

on:
  push:
    branches: ["main"]
  pull_request:
  # The merge queue waits for this required check on each queued change.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's previous run. Runs on main are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
