# Tests against the clang toolchain cached by toolchain-cache-clang.yml.
name: Test Clang (Prebuilt Cache)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "clang-p2996"
      - ".github/workflows/toolchain-cache-clang.yml"
  workflow_run:
    workflows: ["Build Clang Toolchain (Cache)"]
    types: [completed]
  pull_request:
    paths-ignore:
      - "clang-p2996"
      - ".github/workflows/toolchain-cache-clang.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.build_type }})
    if: ${{ github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo, Debug]
    env:
      BUILD_DIR: build/cmake-${{ matrix.build_type }}
      SANITIZE_FLAGS: ${{ matrix.build_type == 'Debug' && '-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha || github.sha }}

      - name: Compute cache key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          CLANG_SHA="$(git rev-parse HEAD:clang-p2996)"
          BUILD_INPUT_HASH="$(sha256sum .github/workflows/toolchain-cache-clang.yml | sha256sum | cut -d' ' -f1)"
          CACHE_KEY="clang-${{ runner.os }}-${{ runner.arch }}-${CLANG_SHA:0:12}-${BUILD_INPUT_HASH:0:12}"
          echo "cache_key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore clang toolchain from cache
        id: cache
        uses: actions/cache@v6
        with:
          path: /opt/toolchain-clang
          key: ${{ steps.key.outputs.cache_key }}

      - name: Fail fast on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "Clang toolchain not in cache: ${{ steps.key.outputs.cache_key }}"
          echo "Run workflow 'Build Clang Toolchain (Cache)' first to populate the cache."
          exit 1

      - name: Configure CMake
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=/opt/toolchain-clang/bin/clang++ \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++ ${SANITIZE_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -L/opt/toolchain-clang/lib -Wl,-rpath,/opt/toolchain-clang/lib"

      - name: Build tests
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Test AD with CTest
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure
