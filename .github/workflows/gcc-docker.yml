# Tests against the GCC image published by CppReflectionAD/gcc's CI.
# The image tag is derived from the pinned gcc submodule commit, so the
# compiler always matches the submodule pin.
name: Test GCC (Docker)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.tag.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Resolve image for pinned gcc
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 1. Fetch remote branch heads from the GCC repo into local tracking refs
          GCC_REPO="https://x-access-token:${GH_TOKEN}@github.com/CppReflectionAD/gcc.git"
          git fetch --no-tags --depth=100 "$GCC_REPO" \
            +refs/heads/p4395:refs/remotes/gcc/p4395 \
            +refs/heads/p4395ci:refs/remotes/gcc/p4395ci

          # 2. Compute the merge-base commit SHA between p4395 and p4395ci
          sha="$(git merge-base gcc/p4395 gcc/p4395ci)"
          echo "Computed merge-base SHA: $sha"

          # 3. Derive the target image tag (using short SHA or specific tag pattern)
          image="ghcr.io/cppreflectionad/gcc:sha-${sha:0:7}"

          # 4. Verify Docker image exists in GHCR
          if ! docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "::error::No image $image found for commit $sha. Verify that the GCC CI built and published the image."
            exit 1
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.build_type }})
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.resolve.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo, Debug]
    env:
      BUILD_DIR: build/cmake-${{ matrix.build_type }}

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake make python3

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure CMake
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=/opt/gcc/bin/g++

      - name: Build tests
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Test AD with CTest
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure
