# Tests against the GCC image published by CppReflectionAD/gcc's CI.
# The image tag is derived from the pinned gcc submodule commit, so the
# compiler always matches the submodule pin.
name: Test GCC (Docker)

on:
  push:
    branches: ["main","docker"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.tag.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image for pinned gcc
        id: tag
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD:gcc-mirror)"
          echo "Pinned gcc-mirror commit: $sha"

          # Construct image tag from the pinned commit and verify the GHCR artifact.
          image="ghcr.io/cppreflectionad/gcc:sha-${sha:0:7}"
          if ! docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "::error::No image $image found for commit $sha."
            exit 1
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.build_type }})
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.resolve.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo, Debug]
    env:
      BUILD_DIR: build/cmake-${{ matrix.build_type }}

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake make python3

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure CMake
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=/opt/gcc/bin/g++

      - name: Build tests
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Test AD with CTest
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure
