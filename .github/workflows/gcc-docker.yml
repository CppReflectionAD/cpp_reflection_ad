# Tests against the GCC image published by CppReflectionAD/gcc's CI.
name: Test GCC (Docker)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/cppreflectionad/gcc:p4395ci
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, RelWithDebInfo, Debug]
    env:
      BUILD_DIR: build/cmake-${{ matrix.build_type }}

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake make python3

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure CMake
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=/opt/gcc/bin/g++

      - name: Build tests
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Test AD with CTest
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure
