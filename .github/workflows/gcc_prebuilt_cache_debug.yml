# actions/cache variant for reproducing the gcc reflection debug-build failure
# through the CMake path used by this repository.
name: Test GCC (Prebuilt Cache Debug)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "gcc-mirror"
      - ".github/workflows/toolchain-cache-gcc.yml"
  workflow_run:
    workflows: [ "Build GCC Toolchain (Cache)" ]
    types: [ completed ]
  pull_request:
    paths-ignore:
      - "gcc-mirror"
      - ".github/workflows/toolchain-cache-gcc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-debug-repro:
    if: ${{ github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' &&
            github.event.workflow_run.head_sha || github.sha }}

      - name: Compute cache key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          GCC_MIRROR_SHA="$(git rev-parse HEAD:gcc-mirror)"
          BUILD_INPUT_HASH="$(sha256sum .github/workflows/toolchain-cache-gcc.yml | sha256sum | cut -d' ' -f1)"
          CACHE_KEY="gcc-${{ runner.os }}-${{ runner.arch }}-${GCC_MIRROR_SHA:0:12}-${BUILD_INPUT_HASH:0:12}"
          echo "cache_key=${CACHE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore gcc toolchain from cache
        id: cache
        uses: actions/cache@v6
        with:
          path: /opt/toolchain-gcc
          key: ${{ steps.key.outputs.cache_key }}

      - name: Fail fast on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "GCC toolchain not in cache: ${{ steps.key.outputs.cache_key }}"
          echo "Run workflow 'Build GCC Toolchain (Cache)' first to populate the cache."
          exit 1

      - name: Configure CMake (gcc cached relwithdebinfo)
        run: |
          GCC_LIBSTDCPP_DIR="$(dirname "$(/opt/toolchain-gcc/bin/g++ -print-file-name=libstdc++.so.6)")"
          GCC_LIBGCC_DIR="$(dirname "$(/opt/toolchain-gcc/bin/g++ -print-file-name=libgcc_s.so.1)")"
          cmake -S . -B build/cmake-debug \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=/opt/toolchain-gcc/bin/g++ \
            "-DCMAKE_BUILD_RPATH=${GCC_LIBSTDCPP_DIR};${GCC_LIBGCC_DIR}"

      - name: Build known failing target via CMake
        run: cmake --build build/cmake-debug --target is_invertible --parallel

      - name: Build tests (gcc cached relwithdebinfo)
        run: cmake --build build/cmake-debug --parallel

      - name: Test AD with CTest
        run: ctest --test-dir build/cmake-debug --output-on-failure
